x-rails-volumes: &rails_volumes
  - ./ui:/app
  - ./reference:/reference:ro
  - "${RAILS_ACTIVE_STORAGE_HOST_PATH:?RAILS_ACTIVE_STORAGE_HOST_PATH requis}:/app/storage"

x-rails-test-volumes: &rails_test_volumes
  - ./ui:/app
  - ./reference:/reference:ro
  - "${RAILS_TEST_ACTIVE_STORAGE_HOST_PATH:?RAILS_TEST_ACTIVE_STORAGE_HOST_PATH requis}:/app/tmp/storage"

services:
  math-audit:
    image: chatbot-trading-math-audit:development
    build:
      context: .
      dockerfile: Dockerfile.math-audit
    environment:
      MATH_AUDIT_MAX_PDF_BYTES: "${MATH_AUDIT_MAX_PDF_BYTES:?MATH_AUDIT_MAX_PDF_BYTES requis}"
      MATH_AUDIT_MAX_DOCLING_BYTES: "${MATH_AUDIT_MAX_DOCLING_BYTES:?MATH_AUDIT_MAX_DOCLING_BYTES requis}"
      MATH_AUDIT_TIMEOUT_SECONDS: "${MATH_AUDIT_TIMEOUT_SECONDS:?MATH_AUDIT_TIMEOUT_SECONDS requis}"
      MATH_AUDIT_UPLOAD_TIMEOUT_SECONDS: "${MATH_AUDIT_UPLOAD_TIMEOUT_SECONDS:?MATH_AUDIT_UPLOAD_TIMEOUT_SECONDS requis}"
      MATH_AUDIT_PROCESS_SHUTDOWN_SECONDS: "${MATH_AUDIT_PROCESS_SHUTDOWN_SECONDS:?MATH_AUDIT_PROCESS_SHUTDOWN_SECONDS requis}"
      MATH_AUDIT_CONCURRENCY: "${MATH_AUDIT_CONCURRENCY:?MATH_AUDIT_CONCURRENCY requis}"
      MATH_AUDIT_UPLOAD_CHUNK_BYTES: "${MATH_AUDIT_UPLOAD_CHUNK_BYTES:?MATH_AUDIT_UPLOAD_CHUNK_BYTES requis}"
      MATH_AUDIT_ARTIFACT_CHUNK_BYTES: "${MATH_AUDIT_ARTIFACT_CHUNK_BYTES:?MATH_AUDIT_ARTIFACT_CHUNK_BYTES requis}"
      MATH_AUDIT_MAX_FORM_FIELD_BYTES: "${MATH_AUDIT_MAX_FORM_FIELD_BYTES:?MATH_AUDIT_MAX_FORM_FIELD_BYTES requis}"
      MATH_AUDIT_MULTIPART_SPOOL_BYTES: "${MATH_AUDIT_MULTIPART_SPOOL_BYTES:?MATH_AUDIT_MULTIPART_SPOOL_BYTES requis}"
      MATH_CORRECTION_ENDPOINT: "${MATH_CORRECTION_ENDPOINT:?MATH_CORRECTION_ENDPOINT requis}"
      MATH_CORRECTION_MODEL: "${MATH_CORRECTION_MODEL:?MATH_CORRECTION_MODEL requis}"
      MATH_CORRECTION_DPI: "${MATH_CORRECTION_DPI:?MATH_CORRECTION_DPI requis}"
      MATH_CORRECTION_PADDING_POINTS: "${MATH_CORRECTION_PADDING_POINTS:?MATH_CORRECTION_PADDING_POINTS requis}"
      MATH_CORRECTION_TIMEOUT_SECONDS: "${MATH_CORRECTION_TIMEOUT_SECONDS:?MATH_CORRECTION_TIMEOUT_SECONDS requis}"
      MATH_CORRECTION_MAX_RESPONSE_BYTES: "${MATH_CORRECTION_MAX_RESPONSE_BYTES:?MATH_CORRECTION_MAX_RESPONSE_BYTES requis}"
    ports:
      - "127.0.0.1:${MATH_AUDIT_PORT:?MATH_AUDIT_PORT requis}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import json,urllib.request; assert json.load(urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)) == {'status':'ok'}"
      interval: 5s
      timeout: 5s
      retries: 12
    cpus: "${MATH_AUDIT_CPUS:?MATH_AUDIT_CPUS requis}"
    mem_limit: "${MATH_AUDIT_MEMORY:?MATH_AUDIT_MEMORY requis}"
    pids_limit: "${MATH_AUDIT_PIDS_LIMIT:?MATH_AUDIT_PIDS_LIMIT requis}"
    read_only: true
    tmpfs:
      - "/tmp:size=${MATH_AUDIT_TMP_SIZE:?MATH_AUDIT_TMP_SIZE requis},mode=1777"
    init: true
    restart: "no"

  postgres:
    image: postgres:18.4-bookworm@sha256:1961f96e6029a02c3812d7cb329a3b03a3ac2bb067058dec17b0f5596aca9296
    environment:
      POSTGRES_USER: "${RAILS_POSTGRES_USER:?RAILS_POSTGRES_USER requis}"
      POSTGRES_PASSWORD: "${RAILS_POSTGRES_PASSWORD:?RAILS_POSTGRES_PASSWORD requis}"
      POSTGRES_DB: "${RAILS_PRIMARY_DATABASE:?RAILS_PRIMARY_DATABASE requis}"
    volumes:
      - rails_postgres:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - "pg_isready -U ${RAILS_POSTGRES_USER:?RAILS_POSTGRES_USER requis} -d ${RAILS_PRIMARY_DATABASE:?RAILS_PRIMARY_DATABASE requis}"
      interval: 2s
      timeout: 5s
      retries: 30
    cpus: "${RAILS_POSTGRES_CPUS:?RAILS_POSTGRES_CPUS requis}"
    mem_limit: "${RAILS_POSTGRES_MEMORY:?RAILS_POSTGRES_MEMORY requis}"
    pids_limit: "${RAILS_POSTGRES_PIDS_LIMIT:?RAILS_POSTGRES_PIDS_LIMIT requis}"
    restart: "no"

  setup:
    image: chatbot-trading-ui:development
    build:
      context: ./ui
    command:
      - /bin/sh
      - -lc
      - bundle exec rails db:prepare && if [ "${RAILS_ENV:-development}" = "production" ]; then bundle exec rails assets:precompile; fi
    environment: *rails_environment
    volumes: *rails_volumes
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  web:
    image: chatbot-trading-ui:development
    command: bundle exec rails server --binding=0.0.0.0
    environment: *rails_environment
    volumes: *rails_volumes
    ports:
      - "127.0.0.1:${RAILS_PORT:?RAILS_PORT requis}:3000"
    depends_on:
      setup:
        condition: service_completed_successfully
      jobs:
        condition: service_started
    cpus: "${RAILS_WEB_CPUS:?RAILS_WEB_CPUS requis}"
    mem_limit: "${RAILS_WEB_MEMORY:?RAILS_WEB_MEMORY requis}"
    pids_limit: "${RAILS_WEB_PIDS_LIMIT:?RAILS_WEB_PIDS_LIMIT requis}"
    restart: "no"

  jobs:
    image: chatbot-trading-ui:development
    command: bundle exec ruby bin/jobs
    environment: *rails_environment
    volumes: *rails_volumes
    depends_on:
      setup:
        condition: service_completed_successfully
      math-audit:
        condition: service_healthy
    cpus: "${RAILS_JOBS_CPUS:?RAILS_JOBS_CPUS requis}"
    mem_limit: "${RAILS_JOBS_MEMORY:?RAILS_JOBS_MEMORY requis}"
    pids_limit: "${RAILS_JOBS_PIDS_LIMIT:?RAILS_JOBS_PIDS_LIMIT requis}"
    restart: "no"

  test-setup:
    image: chatbot-trading-ui:development
    command: bundle exec rails db:prepare
    environment:
      <<: *rails_environment
      RAILS_ENV: test
    volumes: *rails_test_volumes
    depends_on:
      setup:
        condition: service_completed_successfully
    profiles:
      - test
    restart: "no"

  test:
    image: chatbot-trading-ui:development
    command: bundle exec rails test
    environment:
      <<: *rails_environment
      RAILS_ENV: test
    volumes: *rails_test_volumes
    depends_on:
      test-setup:
        condition: service_completed_successfully
    profiles:
      - test

volumes:
  rails_postgres:
