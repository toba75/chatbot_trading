[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chatbot-trading"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.135.1",
    "uvicorn==0.41.0",
]

[project.scripts]
ui = "app.platform.ui_command:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
