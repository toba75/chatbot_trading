[build-system]
requires = ["setuptools==80.10.2"]
build-backend = "setuptools.build_meta"

[project]
name = "chatbot-trading"
version = "0.1.0"
requires-python = "==3.12.8"
dependencies = [
    "fastapi==0.135.1",
    "pydantic==2.13.4",
    "psycopg[binary]==3.2.13",
    "pypdf==6.14.2",
    "python-multipart==0.0.32",
    "setuptools==80.10.2",
    "starlette==1.3.1",
    "uvicorn==0.41.0",
]

[project.scripts]
api = "app.platform.orchestrator_command:main"
ui = "app.platform.ui_command:main"
gate = "ost_gate.cli:main"
backup-v1 = "ost_gate.operations.backup:main"
restore-v1 = "ost_gate.operations.restore:main"
rebuild-knowledge-projection = "ost_gate.operations.rebuild_knowledge_projection:main"

[dependency-groups]
dev = [
    "pytest==8.4.2",
    "pytest-timeout==2.4.0",
    "pytest-xdist==3.8.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "ost_gate*"]
