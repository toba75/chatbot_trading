[project]
name = "chatbot-trading"
version = "0.1.0"
description = "Pipeline documentaire minimal fondé sur Docling"
requires-python = "==3.12.8"
dependencies = [
    "fonttools==4.60.1",
    "pymupdf==1.27.2.2",
    "pypdf==6.10.2",
]

[project.scripts]
pdf-math-audit = "pdf_math_audit.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "docling-core==2.87.1",
    "pytest==8.4.2",
    "pytest-xdist==3.8.0",
    "ruff==0.15.4",
]

[tool.hatch.build.targets.wheel]
packages = ["pdf_math_audit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: nécessite le conteneur Docling CUDA réellement démarré"]
