application:
  environment: production
  deployment_id: ostrading-production-primary

deployment:
  topology: two_host_local
  hosts:
    docker_local:
      role: application_and_data
      bind_host: 127.0.0.1
      container_listen_host: 0.0.0.0
      public_access: false
    spark_inference:
      role: gemma_only
      dns_name: spark-inference.production.ostrading.internal
      endpoint_hosts:
        - 192.168.1.120
      allowed_client_cidrs:
        - 10.73.0.0/24
  network:
    require_tls: false
    require_api_key: false
    prefer_mtls: false
  placement:
    application: docker_local
    postgres: docker_local
    qdrant: docker_local
    llm_gateway: docker_local
    gemma_vllm: spark_inference

services:
  postgres:
    url: postgresql+psycopg://ostrading_production@postgres-production.ostrading.internal/ostrading_production
    port: 5432
    database: ostrading_production
    role: ostrading_production
    data_volume: ostrading-production-postgres-data
  qdrant:
    url: http://qdrant-production.ostrading.internal:6333
    port: 6333
    instance_id: ostrading-production-qdrant
    storage_volume: ostrading-production-qdrant-data
    collections:
      datastore_identity: ostrading-production-datastore-identity
      knowledge_access: ostrading-production-knowledge-access
  api:
    bind_host: 0.0.0.0
    port: 8082
  workers:
    queue_name: ostrading-production-jobs
    outbox_namespace: ostrading-production-outbox
    progress_namespace: ostrading-production-progress
    concurrency: 8
    docling_concurrency: 2
    granite_concurrency: 1
    local_distribution:
      replicas: 2
      memory_bytes: 2147483648
      cpus: 4
      granite_device: cuda:0
      granite_slots_global: 2
      granite_slots_per_worker: 1
  llm_gateway:
    url: http://llm-gateway-production.ostrading.internal:8092
    port: 8092
    spark_endpoint_url: http://192.168.1.120:8000/v1
    auth_mode: none
    tls_mode: disabled
    timeout_seconds: 120
    retry_before_first_token: 1
    circuit_breaker_failure_threshold: 2
    circuit_breaker_reset_seconds: 30

models:
  llm:
    provider: spark_vllm
    transport: openai_compatible_http
    reference_model: google/gemma-4-26B-A4B-it
    served_model_name: google/gemma-4-26B-A4B-it
    model_revision: google/gemma-4-26B-A4B-it@declared-revision
    runtime: vllm
    runtime_version: nim-1.7.0-variant-api-3.1.0
    context_length_tokens: 32768
    max_output_tokens: 2048
    temperature: 0.0

paths:
  data_root: data/environments/production
  corpus_root: data/environments/production/corpus
  canonical_sources_root: data/environments/production/canonical-sources
  qdrant_storage_root: data/environments/production/qdrant
  postgres_data_root: data/environments/production/postgres
  reports_root: data/environments/production/reports
  logs_root: data/environments/production/logs
  experiments_root: data/environments/production/experiments
  cache_root: data/environments/production/cache
  corpus_quota_bytes: 5368709120

security:
  network_exposure: loopback_only
  allow_public_bind: false
  secrets:
    postgres_password_path: config/secrets/production/postgres_password
    qdrant_api_key_path: config/secrets/production/qdrant_api_key
    llm_gateway_api_key_path: config/secrets/production/llm_gateway_api_key
    tls_ca_certificate_path: config/secrets/production/tls_ca_certificate.pem
    local_api_token_path: config/secrets/production/local_api_token
  audit:
    configuration_hash_required: true
    log_configuration_changes: true

quality_gates:
  post_conversion:
    page_count_match: required
    provenance_coverage_min: 1.0
    missing_page_max: 0
  retrieval:
    citation_required: true
    min_evidence_candidates: 3
  answering:
    unsupported_claim_policy: refuse
    abstention_required_on_insufficient_evidence: true
  llm:
    real_path_required: true
    fallback_model_allowed: false

observability:
  tracing:
    enabled: true
  logs:
    include_payloads: false

runtime:
  profile: docker_local
  workers:
    ingestion: 2
    research: 2
    experiments: 1
  timeouts:
    startup_seconds: 120
    request_seconds: 300
    shutdown_seconds: 30
  resource_limits:
    cpu_count: 8
    memory_gb: 32
    gpu_required: false
