services:
  edge-gateway:
    image: caddy@sha256:af32e97399febea808609119bb21544d0265c58a02836576e32a2d082c262c17
    networks:
      - edge
      - core
    depends_on:
      ui:
        condition: service_healthy
      orchestrator-api:
        condition: service_healthy
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    tmpfs:
      - /tmp
    healthcheck:
      test:
        - CMD-SHELL
        - "wget --spider --quiet --no-check-certificate https://localhost:8443/health"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: "no"
    read_only: true

  ui:
    image: ostrading/ui:0.1.0-m013-environments-${OSTRADING_IMAGE_REVISION?OSTRADING_IMAGE_REVISION requis}
    build:
      context: ../..
      dockerfile: deploy/local-compose/Dockerfile
      target: generic-service
      args:
        OSTRADING_IMAGE_REVISION: "${OSTRADING_IMAGE_REVISION?OSTRADING_IMAGE_REVISION requis}"
        OSTRADING_POSTGRES_SCHEMA_VERSION: "${OSTRADING_POSTGRES_SCHEMA_VERSION?OSTRADING_POSTGRES_SCHEMA_VERSION requis}"
    command:
      - python
      - -m
      - app.platform.local_runtime
      - serve-http
      - ui
      - "8081"
      - --config
      - /workspace/config/application.yaml
    expose:
      - "8081"
    networks:
      - core
    depends_on:
      orchestrator-api:
        condition: service_healthy
    volumes:
      - ../../config/application.schema.json:/workspace/config/application.schema.json:ro
    secrets:
      - local_api_token
    healthcheck:
      test:
        - CMD-SHELL
        - "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/health', timeout=5).read()\""
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: "no"
    read_only: true

  orchestrator-api:
    image: ostrading/orchestrator-api:0.1.0-m013-environments-schema-${OSTRADING_POSTGRES_SCHEMA_VERSION?OSTRADING_POSTGRES_SCHEMA_VERSION requis}-${OSTRADING_IMAGE_REVISION?OSTRADING_IMAGE_REVISION requis}
    build:
      context: ../..
      dockerfile: deploy/local-compose/Dockerfile
      target: orchestrator-api
      args:
        OSTRADING_IMAGE_REVISION: "${OSTRADING_IMAGE_REVISION?OSTRADING_IMAGE_REVISION requis}"
        OSTRADING_POSTGRES_SCHEMA_VERSION: "${OSTRADING_POSTGRES_SCHEMA_VERSION?OSTRADING_POSTGRES_SCHEMA_VERSION requis}"
    command:
      - --config
      - /workspace/config/application.yaml
    networks:
      - core
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      llm-gateway:
        condition: service_healthy
    volumes:
      - ../../config/application.schema.json:/workspace/config/application.schema.json:ro
    tmpfs:
      - /tmp:size=128m,mode=1777
    healthcheck:
      test:
        - CMD-SHELL
        - "python -m app.platform.environment_compose check-http --service orchestrator-api --path /ready --config /workspace/config/application.yaml"
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s
    stop_grace_period: 30s
    restart: "no"
    read_only: true

  llm-gateway:
    image: ostrading/llm-gateway:0.1.0-m013-environments-${OSTRADING_IMAGE_REVISION?OSTRADING_IMAGE_REVISION requis}
    build:
      context: ../..
      dockerfile: deploy/local-compose/Dockerfile
      target: generic-service
      args:
        OSTRADING_IMAGE_REVISION: "${OSTRADING_IMAGE_REVISION?OSTRADING_IMAGE_REVISION requis}"
        OSTRADING_POSTGRES_SCHEMA_VERSION: "${OSTRADING_POSTGRES_SCHEMA_VERSION?OSTRADING_POSTGRES_SCHEMA_VERSION requis}"
    networks:
      - core
      - spark-egress
    volumes:
      - ../../config/application.schema.json:/workspace/config/application.schema.json:ro
    healthcheck:
      test:
        - CMD-SHELL
        - "python -m app.platform.environment_compose check-http --service llm-gateway --path /health --config /workspace/config/application.yaml"
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 10s
    restart: "no"
    read_only: true

  postgres:
    image: postgres@sha256:7e5df973a74872482e320dcbdeb055e178d6f42de0558b083892c50cda833c96
    expose:
      - "5432"
    networks:
      - core
    volumes:
      - postgres-data:/var/lib/postgresql/data
    secrets:
      - postgres_password
    restart: "no"

  qdrant:
    image: qdrant/qdrant@sha256:318c11b72aaab96b36e9662ad244de3cabd0653a1b942d4e8191f18296c81af0
    expose:
      - "6333"
    networks:
      - core
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      test:
        - CMD-SHELL
        - "test -d /qdrant/storage"
