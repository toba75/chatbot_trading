    volumes:
      - model-cache:/models
      - ../../config/application.schema.json:/workspace/config/application.schema.json:ro
    healthcheck:
      test:
        - CMD-SHELL
        - "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8102/health', timeout=5).read()\""
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: "no"
    read_only: true

  ocr-runtime:
    image: docker:27.5.1-dind@sha256:aa3df78ecf320f5fafdce71c659f1629e96e9de0968305fe1de670e0ca9176ce
    privileged: true
    environment:
      DOCKER_HOST: tcp://127.0.0.1:2375
      DOCKER_TLS_CERTDIR: ""
    entrypoint:
      - /bin/sh
      - -ec
    command:
      - |
        dockerd-entrypoint.sh --host=tcp://0.0.0.0:2375 --host=unix:///var/run/docker.sock &
        daemon_pid=$!
        trap 'kill -TERM "$$daemon_pid"; wait "$$daemon_pid"' INT TERM
        until docker info >/dev/null 2>&1; do
          kill -0 "$$daemon_pid"
          sleep 1
        done
        docker pull jbarlow83/ocrmypdf@sha256:88d50f2ce7c054e5aacfc48794eca50dbb8af9a6ef1d2a540456dcd9a4687e42
        docker image inspect jbarlow83/ocrmypdf@sha256:88d50f2ce7c054e5aacfc48794eca50dbb8af9a6ef1d2a540456dcd9a4687e42 >/dev/null
        wait "$$daemon_pid"
    networks:
      - ocr-control
      - ocr-egress
    volumes:
      - ocr-runtime-data:/var/lib/docker
    tmpfs:
      - /tmp:size=256m,mode=1777
      - /var/run:size=32m,mode=0755
    healthcheck:
      test:
        - CMD-SHELL
        - "docker image inspect jbarlow83/ocrmypdf@sha256:88d50f2ce7c054e5aacfc48794eca50dbb8af9a6ef1d2a540456dcd9a4687e42 >/dev/null 2>&1"
      interval: 10s
      timeout: 10s
      retries: 60
      start_period: 20s
    restart: "no"

  worker-documents:
    image: ostrading/worker-documents:0.1.0-m013-environments-schema-${OSTRADING_POSTGRES_SCHEMA_VERSION?OSTRADING_POSTGRES_SCHEMA_VERSION requis}-${OSTRADING_IMAGE_REVISION?OSTRADING_IMAGE_REVISION requis}
    build:
      context: ../..
      dockerfile: deploy/local-compose/Dockerfile
      target: worker-documents
      args:
        OSTRADING_IMAGE_REVISION: "${OSTRADING_IMAGE_REVISION?OSTRADING_IMAGE_REVISION requis}"
        OSTRADING_POSTGRES_SCHEMA_VERSION: "${OSTRADING_POSTGRES_SCHEMA_VERSION?OSTRADING_POSTGRES_SCHEMA_VERSION requis}"
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
          pids: 256
    command:
      - --worker-id
      - worker-documents
      - --lease-seconds
      - "120"
      - --poll-seconds
      - "0.5"
      - --config
      - /workspace/config/application.yaml
    networks:
      - core
      - ocr-control
    depends_on:
      orchestrator-api:
        condition: service_healthy
      postgres:
        condition: service_healthy
      llm-gateway:
        condition: service_healthy
      ocr-runtime:
        condition: service_healthy
    volumes:
      - ../../config/application.schema.json:/workspace/config/application.schema.json:ro
    tmpfs:
      - /tmp:size=128m,mode=1777
    healthcheck:
      test:
        - CMD-SHELL
        - "python -m app.platform.environment_compose check-worker --worker-id worker-documents --config /workspace/config/application.yaml"
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    restart: unless-stopped
    read_only: true

  worker-projection:
