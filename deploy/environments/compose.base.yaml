    networks:
      - core
    volumes:
      - model-cache:/models
      - ../../config/application.schema.json:/workspace/config/application.schema.json:ro
    healthcheck:
      test:
        - CMD-SHELL
        - "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8101/health', timeout=5).read()\""
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: "no"
    read_only: true

  reranker-service:
    image: ostrading/reranker-service:0.1.0-m013-environments-${OSTRADING_IMAGE_REVISION?OSTRADING_IMAGE_REVISION requis}
    build:
      context: ../..
      dockerfile: deploy/local-compose/Dockerfile
      target: generic-service
      args:
