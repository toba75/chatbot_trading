name: ostrading-test

x-profile-volumes: &profile-volumes
  - ../../config/environments/test.yaml:/workspace/config/application.yaml:ro

services:
  edge-gateway:
    ports:
      - "127.0.0.1:19443:8443"
    volumes:
      - ./Caddyfile.test:/etc/caddy/Caddyfile:ro

  ui:
    volumes: *profile-volumes
    secrets:
      - source: local_api_token
        target: /workspace/config/secrets/test/local_api_token

  orchestrator-api:
    expose:
      - "8081"
    volumes:
      - ../../config/environments/test.yaml:/workspace/config/application.yaml:ro
      - application-data:/workspace/data/environments/test
    secrets:
      - source: postgres_password
        target: /workspace/config/secrets/test/postgres_password
      - source: qdrant_api_key
        target: /workspace/config/secrets/test/qdrant_api_key
      - source: local_api_token
        target: /workspace/config/secrets/test/local_api_token

  llm-gateway:
    command:
      - python
      - -m
      - app.platform.local_runtime
      - serve-http
      - llm-gateway
      - "8091"
      - --config
      - /workspace/config/application.yaml
    expose:
      - "8091"
    networks:
      core:
        aliases:
          - llm-gateway-test
      spark-egress: {}
    volumes: *profile-volumes
    labels:
      org.ostrading.environment: test
      org.ostrading.spark-endpoint: http://192.168.1.120:8000/v1

  postgres:
    networks:
      core:
        aliases:
          - postgres-test
    environment:
      POSTGRES_DB: ostrading_test
      POSTGRES_USER: ostrading_test
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    healthcheck:
      test:
        - CMD-SHELL
        - "test \"$$(cat /proc/1/comm)\" = \"postgres\" && test \"$$(psql -U ostrading_test -d ostrading_test -Atqc 'SELECT 1')\" = \"1\""
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  qdrant:
    networks:
      core:
        aliases:
          - qdrant-test

  granite-docling:
    volumes: *profile-volumes

  embedding-service:
    volumes: *profile-volumes

  reranker-service:
    volumes: *profile-volumes

  ocr-runtime:
    volumes:
      - application-data:/workspace/data/environments/test

  worker-documents:
    volumes:
      - ../../config/environments/test.yaml:/workspace/config/application.yaml:ro
      - application-data:/workspace/data/environments/test
      - ../../data/docling_assets/native:/workspace/data/environments/test/docling_assets/native:ro
      - ../../data/docling_assets/granite:/workspace/data/environments/test/docling_assets/granite:ro
    secrets:
      - source: postgres_password
        target: /workspace/config/secrets/test/postgres_password

  worker-projection:
    volumes:
      - ../../config/environments/test.yaml:/workspace/config/application.yaml:ro
      - application-data:/workspace/data/environments/test
    secrets:
      - source: postgres_password
        target: /workspace/config/secrets/test/postgres_password
      - source: qdrant_api_key
        target: /workspace/config/secrets/test/qdrant_api_key

networks:
  edge:
    name: ostrading-test-edge
  core:
    name: ostrading-test-core
  spark-egress:
    name: ostrading-test-spark-egress
  ocr-egress:
    name: ostrading-test-ocr-egress

volumes:
  caddy-data:
    name: ostrading-test-caddy-data
  caddy-config:
    name: ostrading-test-caddy-config
  postgres-data:
    name: ostrading-test-postgres-data
  qdrant-data:
    name: ostrading-test-qdrant-data
  application-data:
    name: ostrading-test-application-data
  model-cache:
    name: ostrading-test-model-cache
  ocr-runtime-data:
    name: ostrading-test-ocr-runtime-data
  ocr-runtime-socket:
    name: ostrading-test-ocr-runtime-socket

secrets:
  postgres_password:
    file: ../../config/secrets/test/postgres_password
  local_api_token:
    file: ../../config/secrets/test/local_api_token
  qdrant_api_key:
    file: ../../config/secrets/test/qdrant_api_key
