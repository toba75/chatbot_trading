name: trading-research-assistant

services:
  edge-gateway:
    image: caddy@sha256:af32e97399febea808609119bb21544d0265c58a02836576e32a2d082c262c17
    ports:
      - "127.0.0.1:${OST_EDGE_HTTPS_PORT?OST_EDGE_HTTPS_PORT requis}:8443"
    networks:
      - edge
      - core
    depends_on:
      ui:
        condition: service_healthy
      orchestrator-api:
        condition: service_healthy
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    tmpfs:
      - /tmp
    environment:
      CADDY_ADMIN: "${CADDY_ADMIN?CADDY_ADMIN requis}"
    healthcheck:
      test:
        - CMD-SHELL
        - "wget --spider --quiet --no-check-certificate https://localhost:8443/health"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: "no"
    read_only: true

  ui:
    image: ostrading/ui:0.0.0-m002
    build:
      context: ../..
      dockerfile: deploy/local-compose/Dockerfile
    command:
      - python
      - -m
      - app.platform.local_runtime
      - serve-http
      - ui
      - "8081"
      - --config
      - /workspace/config/application.yaml
    expose:
      - "8081"
    networks:
      - core
    volumes:
      - ./application.compose.yaml:/workspace/config/application.yaml:ro
      - ../../config/application.schema.json:/workspace/config/application.schema.json:ro
    secrets:
      - local_api_token
    healthcheck:
      test:
        - CMD-SHELL
        - "python -c \"import socket; socket.create_connection(('127.0.0.1', 8081), 2).close()\""
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: "no"
    read_only: true

  orchestrator-api:
    image: ostrading/orchestrator-api:0.1.0-m013-fastapi-schema-${OSTRADING_POSTGRES_SCHEMA_VERSION?OSTRADING_POSTGRES_SCHEMA_VERSION requis}-${OSTRADING_IMAGE_REVISION?OSTRADING_IMAGE_REVISION requis}
    build:
      context: ../..
      dockerfile: deploy/local-compose/Dockerfile
      target: orchestrator-api
      args:
        OSTRADING_IMAGE_REVISION: "${OSTRADING_IMAGE_REVISION?OSTRADING_IMAGE_REVISION requis}"
        OSTRADING_POSTGRES_SCHEMA_VERSION: "${OSTRADING_POSTGRES_SCHEMA_VERSION?OSTRADING_POSTGRES_SCHEMA_VERSION requis}"
    command:
      - --config
      - /workspace/config/application.yaml
    expose:
      - "8080"
    networks:
      - core
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      llm-gateway:
        condition: service_healthy
    volumes:
      - corpus-data:/workspace/data/corpus
      - ./application.compose.yaml:/workspace/config/application.yaml:ro
      - ../../config/application.schema.json:/workspace/config/application.schema.json:ro
    secrets:
      - postgres_password
      - local_api_token
    tmpfs:
      - /tmp:size=128m,mode=1777
    healthcheck:
      test:
        - CMD-SHELL
        - "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/ready', timeout=300).read()\""
      interval: 30s
      timeout: 300s
      retries: 3
      start_period: 120s
    stop_grace_period: 30s
    restart: "no"
    read_only: true

  llm-gateway:
    image: ostrading/llm-gateway:0.0.0-m002
    build:
      context: ../..
      dockerfile: deploy/local-compose/Dockerfile
    command:
      - python
      - -m
      - app.platform.local_runtime
      - serve-http
      - llm-gateway
      - "8090"
      - --config
      - /workspace/config/application.yaml
    expose:
      - "8090"
    networks:
      - core
      - spark-egress
    volumes:
      - ./application.compose.yaml:/workspace/config/application.yaml:ro
      - ../../config/application.schema.json:/workspace/config/application.schema.json:ro
      - ../../config/secrets/local:/workspace/config/secrets/local:ro
    healthcheck:
      test:
        - CMD-SHELL
        - "python -c \"import socket; socket.create_connection(('127.0.0.1', 8090), 2).close()\""
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: "no"
    read_only: true

  postgres:
    image: postgres@sha256:7e5df973a74872482e320dcbdeb055e178d6f42de0558b083892c50cda833c96
    expose:
      - "5432"
    networks:
      - core
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../postgres/migrations:/docker-entrypoint-initdb.d:ro
    environment:
      POSTGRES_DB: "ostrading"
      POSTGRES_USER: "ostrading"
      POSTGRES_PASSWORD_FILE: "/run/secrets/postgres_password"
    secrets:
      - postgres_password
    healthcheck:
      test:
        - CMD-SHELL
        - "pg_isready -U ostrading -d ostrading"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: "no"

  qdrant:
    image: qdrant/qdrant@sha256:318c11b72aaab96b36e9662ad244de3cabd0653a1b942d4e8191f18296c81af0
    expose:
      - "6333"
    networks:
      - core
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      test:
        - CMD-SHELL
        - "test -d /qdrant/storage"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: "no"

  granite-docling:
    image: ostrading/granite-docling:0.0.0-m002
    build:
      context: ../..
      dockerfile: deploy/local-compose/Dockerfile.granite
    command:
      - python
      - -m
      - app.platform.local_runtime
      - serve-http
      - granite-docling
      - "8001"
      - --config
      - /workspace/config/application.yaml
    expose:
      - "8001"
    networks:
      - core
    volumes:
      - model-cache:/models
      - ./application.compose.yaml:/workspace/config/application.yaml:ro
      - ../../config/application.schema.json:/workspace/config/application.schema.json:ro
    healthcheck:
      test:
        - CMD-SHELL
        - "python -c \"import socket; socket.create_connection(('127.0.0.1', 8001), 2).close()\""
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: "no"
    read_only: true

  embedding-service:
    image: ostrading/embedding-service:0.0.0-m002
    build:
      context: ../..
      dockerfile: deploy/local-compose/Dockerfile
    command:
      - python
      - -m
      - app.platform.local_runtime
      - serve-http
      - embedding-service
      - "8101"
      - --config
      - /workspace/config/application.yaml
    expose:
      - "8101"
    networks:
      - core
    volumes:
      - model-cache:/models
      - ./application.compose.yaml:/workspace/config/application.yaml:ro
      - ../../config/application.schema.json:/workspace/config/application.schema.json:ro
    healthcheck:
      test:
        - CMD-SHELL
        - "python -c \"import socket; socket.create_connection(('127.0.0.1', 8101), 2).close()\""
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: "no"
    read_only: true

  reranker-service:
    image: ostrading/reranker-service:0.0.0-m002
    build:
      context: ../..
      dockerfile: deploy/local-compose/Dockerfile
    command:
      - python
      - -m
      - app.platform.local_runtime
      - serve-http
      - reranker-service
      - "8102"
      - --config
      - /workspace/config/application.yaml
    expose:
      - "8102"
    networks:
      - core
    volumes:
      - model-cache:/models
      - ./application.compose.yaml:/workspace/config/application.yaml:ro
      - ../../config/application.schema.json:/workspace/config/application.schema.json:ro
    healthcheck:
      test:
        - CMD-SHELL
        - "python -c \"import socket; socket.create_connection(('127.0.0.1', 8102), 2).close()\""
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: "no"
    read_only: true

  worker-documents:
    image: ostrading/worker-documents:0.1.0-m013-fastapi-schema-${OSTRADING_POSTGRES_SCHEMA_VERSION?OSTRADING_POSTGRES_SCHEMA_VERSION requis}-${OSTRADING_IMAGE_REVISION?OSTRADING_IMAGE_REVISION requis}
    build:
      context: ../..
      dockerfile: deploy/local-compose/Dockerfile
      target: worker-documents
      args:
        OSTRADING_IMAGE_REVISION: "${OSTRADING_IMAGE_REVISION?OSTRADING_IMAGE_REVISION requis}"
        OSTRADING_POSTGRES_SCHEMA_VERSION: "${OSTRADING_POSTGRES_SCHEMA_VERSION?OSTRADING_POSTGRES_SCHEMA_VERSION requis}"
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
          pids: 256
    command:
      - --worker-id
      - worker-documents
      - --lease-seconds
      - "120"
      - --poll-seconds
      - "0.5"
      - --config
      - /workspace/config/application.yaml
    networks:
      - core
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - corpus-data:/workspace/data/corpus
      - document-artifacts:/workspace/data
      - ./application.compose.yaml:/workspace/config/application.yaml:ro
      - ../../config/application.schema.json:/workspace/config/application.schema.json:ro
    secrets:
      - postgres_password
    tmpfs:
      - /tmp:size=128m,mode=1777
    healthcheck:
      test:
        - CMD-SHELL
        - "test -d /workspace/data/corpus"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    read_only: true

  worker-research:
    image: ostrading/worker-research:0.0.0-m002
    build:
      context: ../..
      dockerfile: deploy/local-compose/Dockerfile
    command:
      - python
      - -m
      - app.platform.local_runtime
      - run-worker
      - worker-research
      - --config
      - /workspace/config/application.yaml
    networks:
      - core
    volumes:
      - ./application.compose.yaml:/workspace/config/application.yaml:ro
      - ../../config/application.schema.json:/workspace/config/application.schema.json:ro
    healthcheck:
      test:
        - CMD-SHELL
        - "python -m app.platform.local_runtime check-worker worker-research"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: "no"
    read_only: true

  worker-backtest:
    image: ostrading/worker-backtest:0.0.0-m002
    build:
      context: ../..
      dockerfile: deploy/local-compose/Dockerfile
    command:
      - python
      - -m
      - app.platform.local_runtime
      - run-worker
      - worker-backtest
      - --config
      - /workspace/config/application.yaml
    networks:
      - core
    volumes:
      - experiment-data:/workspace/data/experiments
      - ./application.compose.yaml:/workspace/config/application.yaml:ro
      - ../../config/application.schema.json:/workspace/config/application.schema.json:ro
    healthcheck:
      test:
        - CMD-SHELL
        - "test -d /workspace/data/experiments"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: "no"

  backtest-engine:
    image: ostrading/backtest-engine:0.0.0-m002
    build:
      context: ../..
      dockerfile: deploy/local-compose/Dockerfile
    command:
      - python
      - -m
      - app.platform.local_runtime
      - serve-http
      - backtest-engine
      - "8200"
      - --config
      - /workspace/config/application.yaml
    expose:
      - "8200"
    networks:
      - core
    volumes:
      - ./application.compose.yaml:/workspace/config/application.yaml:ro
      - ../../config/application.schema.json:/workspace/config/application.schema.json:ro
    healthcheck:
      test:
        - CMD-SHELL
        - "python -c \"import socket; socket.create_connection(('127.0.0.1', 8200), 2).close()\""
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: "no"
    read_only: true

networks:
  edge: {}
  core:
    internal: true
  spark-egress: {}

volumes:
  caddy-data: {}
  caddy-config: {}
  postgres-data: {}
  qdrant-data: {}
  model-cache: {}
  corpus-data: {}
  document-artifacts: {}
  experiment-data: {}

secrets:
  postgres_password:
    file: ./secrets/postgres_password
  local_api_token:
    file: ./secrets/local_api_token
