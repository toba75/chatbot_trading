deployment:
  topology: two_host_local
  hosts:
    docker_local:
      role: application_and_data
      bind_host: 127.0.0.1
      container_listen_host: 0.0.0.0
      public_access: false
    spark_inference:
      role: gemma_only
      dns_name: spark-inference.home.arpa
      endpoint_hosts:
        - 192.168.1.120
      allowed_client_cidrs:
        - 192.168.1.20/32
  network:
    require_tls: false
    require_api_key: false
    prefer_mtls: false
  placement:
    application: docker_local
    postgres: docker_local
    qdrant: docker_local
    llm_gateway: docker_local
    gemma_vllm: spark_inference

services:
  postgres:
    url: postgresql+psycopg://ostrading@postgres/ostrading
    port: 5432
  qdrant:
    url: http://qdrant:6333
    port: 6333
  api:
    bind_host: 0.0.0.0
    port: 8080
  workers:
    queue_name: default
    concurrency: 2
  llm_gateway:
    url: http://llm-gateway:8090
    port: 8090
    spark_endpoint_url: http://192.168.1.120:8000/v1
    auth_mode: none
    tls_mode: disabled
    timeout_seconds: 120
    retry_before_first_token: 1
    circuit_breaker_failure_threshold: 2
    circuit_breaker_reset_seconds: 30

models:
  llm:
    provider: spark_vllm
    transport: openai_compatible_http
    reference_model: google/gemma-4-26B-A4B-it
    served_model_name: google/gemma-4-26B-A4B-it
    model_revision: google/gemma-4-26B-A4B-it@declared-revision
    runtime: vllm
    runtime_version: nim-1.7.0-variant-api-3.1.0
    context_length_tokens: 32768
    max_output_tokens: 2048
    temperature: 0.0

paths:
  data_root: /workspace/data
  corpus_root: /workspace/data/corpus
  canonical_sources_root: /workspace/data/canonical_sources
  qdrant_storage_root: /workspace/data/qdrant
  postgres_data_root: /workspace/data/postgres
  reports_root: /workspace/docs/reports
  logs_root: /workspace/logs
  experiments_root: /workspace/data/experiments
  corpus_quota_bytes: 5368709120

security:
  network_exposure: loopback_only
  allow_public_bind: false
  secrets:
    postgres_password_path: /run/secrets/postgres_password
    llm_gateway_api_key_path: /run/secrets/llm_gateway_api_key
    tls_ca_certificate_path: /run/secrets/tls_ca_certificate.pem
    local_api_token_path: /run/secrets/local_api_token
  audit:
    configuration_hash_required: true
    log_configuration_changes: true

quality_gates:
  post_conversion:
    page_count_match: required
    provenance_coverage_min: 1.0
    missing_page_max: 0
  retrieval:
    citation_required: true
    min_evidence_candidates: 3
  answering:
    unsupported_claim_policy: refuse
    abstention_required_on_insufficient_evidence: true
  llm:
    real_path_required: true
    fallback_model_allowed: false

observability:
  tracing:
    enabled: true
  logs:
    include_payloads: false

runtime:
  profile: docker_local
  workers:
    ingestion: 2
    research: 2
    experiments: 1
  timeouts:
    startup_seconds: 120
    request_seconds: 300
    shutdown_seconds: 30
  resource_limits:
    cpu_count: 8
    memory_gb: 32
    gpu_required: false
